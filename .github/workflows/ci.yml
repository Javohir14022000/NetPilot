name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, sample app builds and local publish
        run: >
          ./gradlew
          :netpilot:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          :netpilot:publishToMavenLocal
          :netpilot-no-op:publishToMavenLocal

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: netpilot/build/reports/tests/
